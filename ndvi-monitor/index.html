<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NDVI Rice Crop Health Monitor Battambang</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <!--
    These libs load via classic CDN <script> tags because their UMD/global
    style breaks under Vite bundling:
    - leaflet + leaflet-draw: UMD that must extend the global `L`
    Earth Engine is no longer loaded client-side — all EE calls go through
    the `ee-data` Supabase Edge Function (service-account auth server-side).
    Everything else (Vue, Chart.js, turf, jsPDF, supabase-js) is bundled by Vite.
  -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <!--
    Three.js (classic build exposes window.THREE) — used only by the marketing
    landing page's hero globe. Loaded as a CDN global, same pattern as Leaflet:
    the webgl/UMD style is not bundled by Vite.
    -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
