<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NDVI Rice Crop Health Monitor — Battambang</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css" />
</head>
<body>
  <div id="app"></div>
  <!--
    These libs load via classic CDN <script> tags because their UMD/global
    style breaks under Vite bundling (same reason Earth Engine stays on CDN):
    - leaflet + leaflet-draw: UMD that must extend the global `L`
    - Google Earth Engine: dynamic function-binding breaks under bundlers
    Everything else (Vue, Chart.js, turf, jsPDF, supabase-js) is bundled by Vite.
  -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/earthengine/1.7.36/earthengine-api.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
