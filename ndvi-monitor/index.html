<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NDVI Rice Crop Health Monitor — Battambang</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="dashboard-toggle" class="dashboard-toggle">☰</div>
  <div id="dashboard" class="dashboard" style="display:none">
    <div class="dashboard-header">
      <h3>My Fields</h3>
      <button id="dashboard-close" class="close-btn">&times;</button>
    </div>
    <div id="field-list"></div>
    <p class="dashboard-hint">Draw a polygon or rectangle on the map, then name it to save.</p>
  </div>

  <div class="map-container">
    <div id="map"></div>
    <div id="map-right" class="map-right" style="display:none"></div>
  </div>
  <div id="status-bar" class="status-bar"></div>
  <div id="slider-panel" class="slider-panel" style="display:none">
    <div class="compare-row">
      <button id="compare-toggle" class="compare-btn">Compare OFF</button>
    </div>
    <div class="slider-group">
      <label class="slider-label">Left: <span id="month-label">June 2026</span> <span id="event-badge" class="event-badge" style="display:none"></span></label>
      <input type="range" id="month-slider" min="0" max="13" value="12" step="1" />
      <div id="event-markers" class="event-markers"></div>
      <div class="slider-labels">
        <span>Jun 2025</span>
        <span>Jul 2026</span>
      </div>
    </div>
    <div id="slider-group-right" class="slider-group" style="display:none">
      <label class="slider-label">Right: <span id="month-label-right">June 2026</span> <span id="event-badge-right" class="event-badge" style="display:none"></span></label>
      <input type="range" id="month-slider-right" min="0" max="13" value="0" step="1" />
      <div id="event-markers-right" class="event-markers"></div>
      <div class="slider-labels">
        <span>Jun 2025</span>
        <span>Jul 2026</span>
      </div>
    </div>
  </div>
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
      <h2>NDVI Rice Crop Health Monitor</h2>
      <p class="subtitle">Battambang, Cambodia</p>
      <button id="sign-in-btn">Sign in with Google</button>
    </div>
  </div>

  <div id="info-panel" class="info-panel" style="display:none">
    <div class="panel-header">
      <button id="export-btn" class="export-btn">Export PNG</button>
      <button id="close-panel" class="close-btn">&times;</button>
    </div>
    <div id="panel-content">
      <p id="point-coords" class="coords"></p>
      <div id="stress-alert" class="stress-alert" style="display:none"></div>
      <canvas id="trend-chart"></canvas>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/earthengine/1.7.36/earthengine-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
